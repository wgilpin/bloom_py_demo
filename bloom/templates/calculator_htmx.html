<!-- Advanced Calculator (htmx-driven, server-side state) -->
<div id="calculator-container" class="bg-white p-6 rounded-lg shadow-lg border border-gray-200 {% if not calculator_visible %}hidden{% endif %}">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Calculator</h3>
        <button 
            onclick="document.getElementById('calculator-container').classList.add('hidden'); document.getElementById('calc-open-btn').classList.remove('hidden');"
            class="text-gray-500 hover:text-gray-700"
        >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    
    <div class="flex-1 flex flex-col justify-center">
        <!-- Display container (swapped by htmx) -->
        <div id="calc-display-container">
            <!-- Error message -->
            <div id="calc-error-display" class="text-right mb-1 hidden">
                <span class="text-red-600 text-sm font-semibold"></span>
            </div>
            
            <!-- Display (editable) -->
            <div class="text-right mb-3">
            <input 
                type="text" 
                id="calc-display" 
                name="expression"
                value="0"
                hx-post="/calculator/button"
                hx-trigger="keyup[key=='Enter']"
                hx-vals='{"button": "="}'
                hx-include="#calc-form-data,#calc-display"
                hx-target="#calc-display-container"
                hx-swap="outerHTML"
                class="w-full px-4 py-3 text-2xl font-mono text-right bg-white rounded border border-gray-300 hover:border-blue-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-colors"
                placeholder="0"
            >
            </div>
        </div>
        
        <!-- Hidden form for htmx (session_id) -->
        <form id="calc-form-data" style="display: none;">
            <input type="hidden" name="session_id" value="{{ session_id }}">
        </form>
        
        <div class="grid grid-cols-5 gap-2">
            <!-- Row 1: SHIFT, Pi, MC, MR, M+ -->
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "SHIFT"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">SHIFT</button>
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "π"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">π</button>
            <button class="calc-btn-memory" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "MC"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">MC</button>
            <button class="calc-btn-memory" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "MR"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">MR</button>
            <button class="calc-btn-memory" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "M+"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">M+</button>
            
            <!-- Row 2: sin, cos, tan, (, ) -->
            <button id="sin-btn" class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "sin"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">sin</button>
            <button id="cos-btn" class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "cos"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">cos</button>
            <button id="tan-btn" class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "tan"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">tan</button>
            <button class="calc-btn-operator" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "("}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">(</button>
            <button class="calc-btn-operator" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": ")"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">)</button>
            
            <!-- Row 3: x^2, x^y, sqrt, AC, DEL -->
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "x^2"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">x²</button>
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "x^y"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">x^y</button>
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "sqrt"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">√</button>
            <button class="calc-btn-clear" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "AC"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">AC</button>
            <button class="calc-btn-clear" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "DEL"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">DEL</button>
            
            <!-- Row 4: 7, 8, 9, 1/x, / -->
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "7"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">7</button>
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "8"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">8</button>
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "9"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">9</button>
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "1/x"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">1/x</button>
            <button class="calc-btn-operator" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "/"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">/</button>
            
            <!-- Row 5: 4, 5, 6, x10^x, * -->
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "4"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">4</button>
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "5"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">5</button>
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "6"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">6</button>
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "x10^x"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">×10^x</button>
            <button class="calc-btn-operator" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "*"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">*</button>
            
            <!-- Row 6: 1, 2, 3, +/-, - -->
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "1"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">1</button>
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "2"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">2</button>
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "3"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">3</button>
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "+/-"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">+/-</button>
            <button class="calc-btn-operator" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "-"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">-</button>
            
            <!-- Row 7: 0, ., Ans, =, + -->
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "0"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">0</button>
            <button class="calc-btn-number" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "."}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">.</button>
            <button class="calc-btn-function" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "Ans"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">Ans</button>
            <button class="calc-btn-equals" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "="}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">=</button>
            <button class="calc-btn-operator" 
                    hx-post="/calculator/button" 
                    hx-vals='{"button": "+"}' 
                    hx-include="#calc-form-data,#calc-display"
                    hx-target="#calc-display-container"
                    hx-swap="outerHTML">+</button>
        </div>
        <p class="text-xs text-gray-500 text-center mt-3">Calculator available for numerical problems</p>
    </div>
</div>

<script>
// Refocus display input after htmx swaps (so Enter works after button clicks)
document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'calc-display-container') {
        const display = document.getElementById('calc-display');
        if (display) {
            display.focus();
        }
    }
});
</script>
